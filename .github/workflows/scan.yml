name: Domain Port Scan

on:
  workflow_dispatch:
  push:
    paths:
      - 'domains.txt'

permissions:
  contents: write

concurrency:
  group: domain-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install nmap, RustScan and nmap-formatter
        run: |
          sudo apt-get update
          sudo apt-get install -y nmap wget unzip
          
          # 1. Install RustScan (new repository address, .zip package format)
          wget https://github.com/bee-san/RustScan/releases/download/2.4.1/rustscan.deb.zip
          unzip rustscan.deb.zip
          sudo dpkg -i rustscan_2.4.1-1_amd64.deb || sudo apt-get install -f -y
          
          # 2. Install nmap-formatter (latest v3.1.4, .tar.gz package format)
          wget https://github.com/vdjagilev/nmap-formatter/releases/download/v3.1.4/nmap-formatter-linux-amd64.tar.gz
          tar -xzf nmap-formatter-linux-amd64.tar.gz
          # Use wildcard to match the extracted file and move it
          mv nmap-formatter-* /usr/local/bin/nmap-formatter
          sudo chmod +x /usr/local/bin/nmap-formatter

      - name: Resolve domains to IPs
        run: python3 scripts/resolve.py

      - name: Run RustScan and hand off to nmap
        run: |
          rustscan -a ips.txt -b 2000 -- -sV -oX scan.xml

      - name: Convert nmap XML to HTML
        run: |
          nmap-formatter html scan.xml > reports/latest.html
          cp reports/latest.html "reports/archive/$(date +%Y-%m-%d).html"

      - name: Commit and push report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update scan report $(date +%Y-%m-%d)"
          git push